<nav class="main-navbar" *ngIf="!router.url.includes('/login') && isLoggedIn()">
  <div class="nav-brand">
    <i class="bi bi-mortarboard-fill"></i> School System
  </div>
  
  <div class="nav-links">
    <a routerLink="/dashboard" routerLinkActive="active-link">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>

    <a routerLink="/students" routerLinkActive="active-link">
      <i class="bi bi-people"></i> Students
    </a>

    <a routerLink="/grades" routerLinkActive="active-link">
      <i class="bi bi-bookmark-star"></i> Grades
    </a>

    <a routerLink="/subjects" routerLinkActive="active-link">
      <i class="bi bi-book"></i> Subjects
    </a>

    <a routerLink="/schedule" routerLinkActive="active-link">
      <i class="bi bi-calendar3"></i> Schedule
    </a>

    <a routerLink="/teachers" routerLinkActive="active-link" *ngIf="isAdmin()">
      <i class="bi bi-person-badge"></i> Teachers
    </a>

    <a routerLink="/classrooms" routerLinkActive="active-link" *ngIf="isAdmin()">
      <i class="bi bi-door-open"></i> Classrooms
    </a>

    <a (click)="logout()" style="cursor: pointer; color: #ff4d4d; margin-left: auto;" class="logout-link">
      <i class="bi bi-box-arrow-right"></i> Logout
    </a>
  </div>
</nav>

<div [ngClass]="router.url.includes('/login') ? 'login-page-wrapper' : 'page-content'">
  <router-outlet></router-outlet>
</div>
