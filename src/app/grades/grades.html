<div class="container mt-4" style="direction: ltr; text-align: left;">
  
  <div class="card shadow-sm mb-4 border-0">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0"><i class="bi bi-pencil-square me-2"></i> Manage Student Grades</h5>
    </div>
    <div class="card-body bg-light">
      <form (ngSubmit)="onSubmit()">
        <div class="row g-3">
          
          <div class="col-md-6">
            <label class="form-label fw-bold">Select Student</label>
            <select class="form-select" [(ngModel)]="gradeForm.studentId" name="studentId" required>
              <option [ngValue]="0" disabled>-- Choose a Student --</option>
              <option *ngFor="let s of students" [value]="s.id">{{ s.name }}</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Select Subject</label>
            <select class="form-select" [(ngModel)]="gradeForm.subjectId" name="subjectId" required>
              <option [ngValue]="0" disabled>-- Choose a Subject --</option>
              <option *ngFor="let sub of subjects" [value]="sub.id">{{ sub.title }}</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">First Exam (20)</label>
            <input type="number" class="form-control" [(ngModel)]="gradeForm.firstExam" name="firstExam" min="0" max="20" required>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">Second Exam (20)</label>
            <input type="number" class="form-control" [(ngModel)]="gradeForm.secondExam" name="secondExam" min="0" max="20" required>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">Final Exam (60)</label>
            <input type="number" class="form-control" [(ngModel)]="gradeForm.finalExam" name="finalExam" min="0" max="60" required>
          </div>

        </div>
        <div class="mt-4">
          <button type="submit" class="btn btn-success me-2" [disabled]="isSaving">
            <i class="bi bi-save me-1"></i> {{ isSaving ? 'Processing...' : (isEditing ? 'Update Grades' : 'Save Grades') }}
          </button>
          <button type="button" class="btn btn-secondary" *ngIf="isEditing" (click)="resetForm()" [disabled]="isSaving">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-header bg-dark text-white">
      <h5 class="mb-0"><i class="bi bi-table me-2"></i> All Registered Grades</h5>
    </div>
    <div class="card-body p-0">
      <table class="table table-hover table-striped mb-0 text-center align-middle">
        <thead class="table-secondary">
          <tr>
            <th>Student Name</th>
            <th>Subject Name</th>
            <th>First</th>
            <th>Second</th>
            <th>Final</th>
            <th>Total</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let g of grades">
            <td class="fw-bold text-primary">{{ g.studentName }}</td>
            <td class="fw-bold text-info">{{ g.subjectName }}</td>
            <td>{{ g.firstExam }}</td>
            <td>{{ g.secondExam }}</td>
            <td>{{ g.finalExam }}</td>
            <td>
              <span class="badge px-3 py-2" [ngClass]="(g.firstExam + g.secondExam + g.finalExam) >= 50 ? 'bg-success' : 'bg-danger'">
                {{ g.firstExam + g.secondExam + g.finalExam }}
              </span>
            </td>
            <td>
              <button class="btn btn-sm btn-primary me-2" (click)="editGrade(g)">
                <i class="bi bi-pencil"></i> Edit
              </button>
              <button class="btn btn-sm btn-danger" (click)="deleteGrade(g.id)">
                <i class="bi bi-trash"></i> Delete
              </button>
            </td>
          </tr>
          <tr *ngIf="grades.length === 0">
            <td colspan="7" class="text-muted p-4">No grades found in the database.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
