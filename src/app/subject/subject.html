<div class="container-fluid p-4 min-vh-100" style="background-color: #f3f4f6;">
  <h2 class="fw-bold mb-4" style="color: #1e3a8a;">Subject Management</h2>

  <div class="card border-0 shadow-sm p-4 mb-5 rounded-4 bg-white" *ngIf="isAdmin()">
    <h5 class="mb-3 text-secondary fw-bold">Add New Subject</h5>
    <form (ngSubmit)="addSubject()" class="row g-3 align-items-end">
      <div class="col-md-7">
        <label class="form-label small fw-bold text-muted">Subject Title</label>
        <input type="text" name="title" [(ngModel)]="newSubject.title" class="form-control border-0 bg-light" placeholder="e.g. Mathematics">
      </div>
      
      <div class="col-md-3">
        <label class="form-label small fw-bold text-muted">Credits</label>
        <input type="number" name="credits" [(ngModel)]="newSubject.credits" class="form-control border-0 bg-light" placeholder="Hours">
      </div>
      
      <div class="col-md-2">
        <button type="submit" class="btn btn-save-custom w-100 py-2">
          <i class="bi bi-plus-circle me-1"></i> Add
        </button>
      </div>
    </form>
  </div>

  <div class="mb-4">
    <div class="input-group shadow-sm rounded-3 overflow-hidden">
      <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
      <input type="text" class="form-control border-0 ps-0" placeholder="Search by title..." [(ngModel)]="searchTerm" (input)="searchSubjects()">
    </div>
  </div>

  <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0 text-start">
        <thead class="bg-light">
          <tr class="text-muted small fw-bold">
            <th class="ps-4 py-3">ID</th>
            <th>SUBJECT TITLE</th>
            <th>CREDITS</th>
            <th class="text-center px-4" *ngIf="isAdmin()">ACTIONS</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let sub of filteredSubjects">
            <td class="ps-4 text-muted small">#{{ sub.id }}</td>
            <td class="fw-bold" style="color: #1e3a8a;">{{ sub.title }}</td>
            <td><span class="badge bg-light text-dark px-3 py-2">{{ sub.credits }} Hrs</span></td>
            
            <td class="text-center px-4" *ngIf="isAdmin()">
              <button class="btn btn-link text-danger p-0" (click)="deleteSubject(sub.id)">
                <i class="bi bi-trash3 fs-5"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
