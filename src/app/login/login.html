<div class="login-container">
  <div class="top-school-title">
    <span class="hat-icon">🎓</span> School System
  </div>

  <div class="login-card">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Please login to access your school dashboard</p>
    </div>

    <form (ngSubmit)="loginForm.valid && onLogin()" #loginForm="ngForm" class="login-form" autocomplete="off" novalidate>
      
      <div class="input-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="loginData.email" 
            placeholder="Enter your email" 
            required
            email
            autocomplete="off"
            #emailInput="ngModel"
          >
        </div>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="loginData.password" 
            placeholder="Enter your password" 
            required
            autocomplete="new-password"
            #passwordInput="ngModel"
          >
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-banner">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-login" [disabled]="!loginForm.valid">
        Sign In
      </button>

    </form>
  </div>
</div>
